<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SharedRoll 管理後台</title>
<!--
  管理後台那一頁(#74)。

  產品負責人 2026-08-25 在票上拍板走**獨立網頁後台**(路 B):他自己登入的小網頁,不動 App、
  需求規格書 3 的「App 內嚴禁任何管理介面」紅線不必改——那條擋的是消費者拿得到的 App 裡長出
  管理介面,這一頁住在 App 外面,而且只有名單上的帳號叫得動。Studio 那條路也留著,沒有取代。

  ## 為什麼是一份靜態檔,不是 Edge Function

  第一版做成 Edge Function(與 ecpay-checkout 同一招:回一整頁 HTML)。部署起來了、網址也通,
  但**瀏覽器拿到的是原始碼而不是網頁**:沒有自訂網域的專案,GET 回 text/html 會被平台改寫成
  text/plain 並套上 `default-src 'none'; sandbox` 的 CSP
  (supabase.com/docs/guides/functions/limits)。自訂網域是付費加購,官方也明說它不是拿來託管
  前端的。所以這一頁改放 GitHub Pages——那是這個專案已經在用、而且不用錢的地方。

  ## 這一份是原始碼,線上那一份是它的複本

  **這裡是真正的那一份**,連同伺服器那一側的遷移與測試。線上跑的是
  `soymilk0211/sharedroll-admin`(公開 repo,GitHub Pages),網址:

      https://soymilk0211.github.io/sharedroll-admin/

  那個 repo 只是託管的地方。**改請改這裡,再把 index.html 複製過去**——反過來改的話兩邊會漂開,
  而下一個人不會知道哪一份才算數。

  ## 這一份是公開的,而它不該讓任何人多做得了一件事

  底下那三個常數(專案網址、publishable key、Google client id)本來就都是公開的,App 的
  app.json 裡也是明文,而且會跟著安裝檔散到每一支手機上。它們**識別**專案,不**授權**任何事。

  真正的門在資料庫:每一支 admin RPC 第一件事都是問 `is_admin()`,而 `admins` 那張表 RLS 開著
  卻一條政策都不給,對 client 角色等於不存在。把這一頁的網址貼給別人,他看到的是一個登入畫面;
  登進去之後看到的是「這個帳號還不是管理員」。這一頁把按鈕藏起來只是禮貌,不是防線。
-->
<style>
  :root {
    --bg: #0E0C0A; --panel: #1A1410; --divider: #2A2622;
    --text: #EDE4D3; --muted: #B5A88F; --accent: #C9C4BC;
    --ok: #7FB069; --bad: #D98A6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  section {
    background: var(--panel); border: 1px solid var(--divider);
    border-radius: 14px; padding: 16px;
  }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--divider); border-radius: 10px;
    font-size: 16px; font-family: inherit;
  }
  /* 房間碼與兌換碼是照著螢幕唸出來打的,等寬字才分得出 0 和 O。 */
  input.code, .code-out { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.08em; }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--accent);
    background: transparent; color: var(--text); font-size: 16px; font-family: inherit;
    cursor: pointer; min-height: 48px;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.4; cursor: default; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .out { margin-top: 12px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .code-out { font-size: 26px; color: var(--text); letter-spacing: 0.12em; }
  pre {
    background: var(--bg); border: 1px solid var(--divider); border-radius: 10px;
    padding: 12px; overflow-x: auto; font-size: 13px; margin: 12px 0 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* 一張訂單卡。 */
  .order {
    border: 1px solid var(--divider); border-radius: 10px;
    padding: 12px; margin-top: 12px;
  }
  .order h3 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .order .who { font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .order .acts { display: flex; gap: 8px; margin-top: 10px; }
  .order .acts button { margin: 0; }
  .order .copy { border-color: var(--divider); }
  /* 訂單狀態的分頁。目前這一格用實邊框,其餘用分隔線的顏色——同一排四顆,靠深淺分主次。 */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { margin: 0; padding: 9px 4px; font-size: 14px; min-height: 42px; border-color: var(--divider); }
  .tabs button[aria-current="true"] { border-color: var(--accent); background: var(--bg); }
  /* 這張單要洗的那幾張。縮圖點下去是高畫質檔(給點點印用的就是那一層)。 */
  .order .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .order .photos figure { margin: 0; width: 72px; }
  .order .photos img {
    width: 72px; height: 72px; object-fit: cover; display: block;
    border-radius: 6px; background: var(--bg); border: 1px solid var(--divider);
  }
  .order .photos figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>SharedRoll 管理後台</h1>

  <section id="gate">
    <h2>先登入</h2>
    <p class="muted">用你在 App 裡登入的那個 Google 帳號。</p>
    <div id="gbtn"></div>
    <div id="gateOut" class="out"></div>
  </section>

  <section id="bootstrap" hidden>
    <h2>這個帳號還不是管理員</h2>
    <p class="muted">把下面這一句貼進 Supabase 的 SQL Editor 按 Run,然後回來重新整理這一頁。</p>
    <pre id="seed"></pre>
    <button id="copySeed" type="button">複製那一句</button>
  </section>

  <section id="orders" hidden>
    <h2>訂單</h2>
    <div class="tabs" id="orderTabs"></div>
    <p class="muted" id="ordersHint"></p>
    <button id="reloadOrders" type="button">重新整理</button>
    <div id="ordersOut" class="out"></div>
    <div id="ordersList"></div>
  </section>

  <section id="issue" hidden>
    <h2>發兌換碼</h2>
    <label for="grants">這張碼把房間升到幾張</label>
    <input id="grants" type="number" inputmode="numeric" min="1" step="1" value="72">
    <label for="note">備註(給自己看的,例如「資工系迎新」)</label>
    <input id="note" type="text" autocapitalize="off">
    <button id="issueBtn" type="button">發一張</button>
    <div id="issueOut" class="out"></div>
  </section>

  <section id="room" hidden>
    <h2>改房間張數</h2>
    <p class="muted">只有<strong>還沒開始拍</strong>的房間改得動。開拍那一刻配額就鎖定並公告了,後台也不能事後改寫。</p>
    <label for="roomCode">房間碼(6 碼)</label>
    <input id="roomCode" class="code" type="text" autocapitalize="characters" autocomplete="off" maxlength="8">
    <button id="findBtn" type="button">查這間房</button>
    <div id="findOut" class="out"></div>
    <div id="setBox" hidden>
      <label for="total" style="margin-top:16px">改成幾張</label>
      <input id="total" type="number" inputmode="numeric" min="1" step="1">
      <button id="setBtn" type="button">改成這個張數</button>
      <div id="setOut" class="out"></div>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/**
 * 都是公開值,與 App 的 app.json 一字不差(見檔頭)。抄過來而不是去讀 app.json:這一頁住在
 * 另一個 repo 的 GitHub Pages 上,拿不到那個檔。三個值變動的時候這裡要跟著改——`test/db` 那疊
 * 守不到這件事,因為它們不是程式邏輯,是設定。
 */
const SUPABASE_URL = 'https://mkqdchybsjccxlnhkqsh.supabase.co';
const PUBLISHABLE_KEY = 'sb_publishable_Pe8FGYslT_c9Z3a8QRC_RA_AtjHfKqq';
const GOOGLE_CLIENT_ID = '89775772955-gjemhl8cj6k3f2j9k0965smqt97klp4j.apps.googleusercontent.com';

const supabase = createClient(SUPABASE_URL, PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);

/** 把一句話寫進某個輸出區。tone 是 'ok'、'bad' 或空白。 */
function say(id, text, tone = '') {
  const node = $(id);
  node.textContent = text;
  node.className = 'out ' + tone;
}

/**
 * 把 RPC 的錯誤翻成一句人話。
 *
 * 資料庫那一側對非管理員是直接拋 not-admin(而不是回一個溫和的 reason),所以這裡要認得它
 * ——PostgREST 會把它包成一段帶著 SQLSTATE 的英文。
 */
function describeError(error) {
  const raw = (error && (error.message || String(error))) || '';
  if (raw.includes('not-admin')) return '這個帳號不在管理員名單上。';
  if (raw.includes('invalid-total')) return '張數要是大於 0 的整數。';
  return '出了點問題:' + raw;
}

/** 登入之後問「我是誰」,據此決定這一頁長什麼樣。 */
async function refresh() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;

  const { data, error } = await supabase.rpc('admin_whoami');
  if (error) { say('gateOut', describeError(error), 'bad'); return; }
  const me = Array.isArray(data) ? data[0] : data;

  $('gate').hidden = true;
  if (me && me.is_admin) {
    $('orders').hidden = false;
    $('issue').hidden = false;
    $('room').hidden = false;
    renderTabs();
    void loadOrders();
    return;
  }
  // 名單是空的時候,這一頁要說得出「該把哪一串貼進 Studio」——不然沒有人知道怎麼開始。
  $('bootstrap').hidden = false;
  $('seed').textContent =
    "insert into public.admins (user_id, note)\nvalues ('" + (me && me.user_id) + "', '產品負責人');";
}

// 登入 -------------------------------------------------------------------------

window.handleGoogleCredential = async (response) => {
  const { error } = await supabase.auth.signInWithIdToken({
    provider: 'google',
    token: response.credential,
  });
  if (error) { say('gateOut', describeError(error), 'bad'); return; }
  await refresh();
};

const gsi = document.createElement('script');
gsi.src = 'https://accounts.google.com/gsi/client';
gsi.async = true;
gsi.onload = () => {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (response) => window.handleGoogleCredential(response),
  });
  // 用按鈕不用 One Tap:One Tap 在 Safari 與擋第三方 cookie 的瀏覽器上常常整個不出現,
  // 而那時畫面上會什麼都沒有,看起來就像這一頁壞了。
  google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'large', width: 320 });
};
gsi.onerror = () => say('gateOut', '連不到 Google 的登入元件,檢查一下網路。', 'bad');
document.head.appendChild(gsi);

// 待處理的訂單 -----------------------------------------------------------------

/**
 * 訂單的四格,對上資料庫狀態機的四個落點(#99)。
 *
 * 原本這一頁**寫死只查 paid**,而卡片上只有一顆「已在點點印下單」。按下去那張單變成
 * submitted,卡片就從畫面上永久消失——後台沒有第二個查詢、也沒有「已出貨」的按鈕,所以那張
 * 單再也推不動。`admin_advance_print_order` 只能往前,救不回來;使用者那一側於是永遠顯示
 * 「沖印中」,實體照片明明已經寄到了。這不是偶發,是**每一張單都會發生**。
 *
 * `empty` 是這一格沒有單時要說的話。四格的空狀態意思完全不同:「待處理」空著是好事,
 * 「出不了」空著也是好事,而「已下單」空著只是還沒輪到。
 */
const ORDER_TABS = [
  {
    state: 'paid',
    label: '待處理',
    hint: '收了錢、還沒去點點印下單的。先付款的排前面。',
    empty: '目前沒有待處理的訂單。',
  },
  {
    state: 'submitted',
    label: '已下單',
    hint: '點點印那邊在做。包裹寄出去之後回來按「已出貨」——不按的話,使用者的 App 會一直寫著「沖印中」。',
    empty: '沒有正在做的訂單。',
  },
  {
    state: 'shipped',
    label: '已出貨',
    hint: '做完寄出去的。留著查,沒有動作要做。',
    empty: '還沒有出貨過的訂單。',
  },
  {
    state: 'failed',
    label: '出不了',
    hint: '收了錢但做不出來的。⚠️ 退款要自己去綠界後台辦,系統裡沒有這條路。',
    empty: '沒有做不出來的訂單。',
  },
];

let currentState = 'paid';

function renderTabs() {
  const tabs = $('orderTabs');
  tabs.innerHTML = '';
  for (const tab of ORDER_TABS) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = tab.label;
    // aria-current 同時是樣式的鉤子與給輔助技術的訊息,不另外加一個 class。
    if (tab.state === currentState) button.setAttribute('aria-current', 'true');
    button.addEventListener('click', () => {
      currentState = tab.state;
      renderTabs();
      void loadOrders();
    });
    tabs.appendChild(button);
  }
  $('ordersHint').textContent = ORDER_TABS.find((t) => t.state === currentState).hint;
}

/**
 * 目前這一格的訂單。
 *
 * Phase 1 的履行是人工的:這一區就是那份工作清單。每張卡要一眼看得到**貼得進點點印表單的
 * 東西**——收件人、電話、郵遞區號+地址、洗幾張——所以有一顆「複製收件資料」把它整段抓走,
 * 不必在小螢幕上逐欄選取;要洗哪幾張則按「看要洗哪幾張」展開(#100)。
 */
// 一次抓幾張。多要一筆是為了知道「後面還有沒有」——第 51 張之後永遠看不到、而畫面一直寫
// 「50 張待處理」,是 #110 裡最痛的那一個:使用者付了錢、訂單卡在 paid、沒有人知道。
const ORDERS_PAGE_SIZE = 200;
let ordersShown = 0;

async function loadOrders(append) {
  const tab = ORDER_TABS.find((t) => t.state === currentState);
  say('ordersOut', '載入中…');
  if (!append) {
    ordersShown = 0;
    $('ordersList').innerHTML = '';
  } else {
    const older = $('ordersMore');
    if (older) older.remove();
  }

  const { data, error } = await supabase.rpc('admin_print_orders', {
    p_state: currentState,
    p_limit: ORDERS_PAGE_SIZE + 1,
    p_offset: ordersShown,
  });
  if (error) { say('ordersOut', describeError(error), 'bad'); return; }

  const rows = Array.isArray(data) ? data : [];
  if (rows.length === 0 && ordersShown === 0) {
    say('ordersOut', tab.empty);
    return;
  }
  const hasMore = rows.length > ORDERS_PAGE_SIZE;
  const orders = hasMore ? rows.slice(0, ORDERS_PAGE_SIZE) : rows;
  for (const order of orders) {
    $('ordersList').appendChild(orderCard(order));
  }
  ordersShown += orders.length;
  say('ordersOut', hasMore ? ordersShown + ' 張(後面還有)' : ordersShown + ' 張');

  if (hasMore) {
    const more = document.createElement('button');
    more.type = 'button';
    more.id = 'ordersMore';
    more.textContent = '載入更多';
    more.addEventListener('click', () => void loadOrders(true));
    $('ordersList').appendChild(more);
  }
}

/** 收件資料整段的樣子。複製出去直接貼進點點印。 */
function recipientBlock(order) {
  // 換行一定要寫成 '\n'。在字串中間直接斷行是語法錯誤,而語法錯誤會讓整個
  // 整段程式一行都不執行——不是只有這個函式壞掉,是整頁死當(#118)。
  return order.recipient_name + '\n'
    + order.recipient_phone + '\n'
    + order.recipient_zip + ' ' + order.recipient_address;
}

function orderCard(order) {
  const card = document.createElement('div');
  card.className = 'order';

  const title = document.createElement('h3');
  const count = order.prints === null ? '相片書' : order.prints + ' 張';
  title.textContent = count + '・NT$' + order.amount + '・' + (order.room_name || '');
  card.appendChild(title);

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = recipientBlock(order);
  card.appendChild(who);

  const acts = document.createElement('div');
  acts.className = 'acts';

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'copy';
  copy.textContent = '複製收件資料';
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(recipientBlock(order));
      copy.textContent = '複製好了';
    } catch {
      // 沒有剪貼簿權限。整段就在上面,自己選起來複製。
      copy.textContent = '複製不了,請手動選取';
    }
  });
  acts.appendChild(copy);

  // 往前推一格的按鈕:每一格各自不同,最後兩格沒有動作(#99)。
  const NEXT = { paid: ['submitted', '已在點點印下單'], submitted: ['shipped', '已出貨'] };
  const next = NEXT[order.state];
  if (next) {
    const done = document.createElement('button');
    done.type = 'button';
    done.textContent = next[1];
    done.addEventListener('click', () => void advance(order.id, next[0], done));
    acts.appendChild(done);
  }

  card.appendChild(acts);

  // 要洗哪幾張(#100)。預設收起來:一張單十幾二十張縮圖,四張單就把清單淹了,而多數時候
  // 要看的是收件資料。展開才去簽網址——presigned URL 是有效期的,不該在載入清單時就先簽一批。
  if (order.state === 'paid' || order.state === 'submitted' || order.state === 'shipped') {
    card.appendChild(photosBlock(order));
  }

  // 出不了的單要提醒退款,因為系統裡沒有那條路(狀態機沒有 refunded 這一格)。
  if (order.state === 'failed') {
    const warn = document.createElement('div');
    warn.className = 'out bad';
    warn.textContent = '這張收了錢但做不出來。退款要去綠界後台辦,系統不會自己退。';
    card.appendChild(warn);
  }

  return card;
}

/**
 * 「看要洗哪幾張」那一塊(#100)。
 *
 * 在這之前後台只印得出「12 張・NT$300」,而人工履行需要的正是**檔案本身**——管理員只能自己
 * 進 Supabase Studio 下 SQL 把 photo_ids 撈出來、再一顆一顆去 R2 找。R2 桶是私有的,所以網址
 * 要由伺服器簽:admin-print-photos 那支 Edge Function 驗完身分,問 SQL「這個管理員能不能拿
 * 這張履行中的訂單的檔案」,才簽 presigned URL 回來。
 *
 * 縮圖點下去開的是**高畫質那一層**——貼進點點印的是那一份,縮圖只是拿來認人的。
 */
function photosBlock(order) {
  const box = document.createElement('div');

  const acts = document.createElement('div');
  acts.className = 'acts';
  const show = document.createElement('button');
  show.type = 'button';
  show.className = 'copy';
  show.textContent = '看要洗哪幾張';
  acts.appendChild(show);
  box.appendChild(acts);

  const out = document.createElement('div');
  out.className = 'out';
  box.appendChild(out);

  const grid = document.createElement('div');
  grid.className = 'photos';
  box.appendChild(grid);

  show.addEventListener('click', async () => {
    show.disabled = true;
    out.textContent = '簽網址中…';
    out.className = 'out';
    grid.innerHTML = '';

    const { data, error } = await supabase.functions.invoke('admin-print-photos', {
      body: { orderId: order.id },
    });
    if (error) {
      show.disabled = false;
      out.textContent = '拿不到照片:' + (error.message || String(error));
      out.className = 'out bad';
      return;
    }
    if (!data || !data.ok) {
      show.disabled = false;
      // reason 直接顯示。這幾種都是我們自己流程走錯(不是管理員做錯什麼),看得到原字串
      // 比看到一句和善的廢話有用。
      out.textContent = '拿不到照片:' + ((data && data.reason) || 'unknown');
      out.className = 'out bad';
      return;
    }

    const hours = Math.round(data.expiresInSeconds / 3600);
    out.textContent = data.photos.length + ' 張,網址 ' + hours + ' 小時內有效。'
      + '點縮圖開的是高畫質那一層,貼進點點印的就是它。';
    for (const photo of data.photos) {
      const figure = document.createElement('figure');

      const link = document.createElement('a');
      link.href = photo.full.url;
      link.target = '_blank';
      link.rel = 'noopener';

      const img = document.createElement('img');
      img.src = photo.thumbnail.url;
      img.loading = 'lazy';
      img.alt = '第 ' + photo.ordinal + ' 張';
      link.appendChild(img);
      figure.appendChild(link);

      const caption = document.createElement('figcaption');
      // 下架的照片仍然列在清單裡(張數不可以悄悄變少),但要標出來是哪一張(#117)。
      // 沒有這一行的話,它只會表現成「有一個網址點下去抓不到東西」。
      caption.textContent = (photo.quantity > 1 ? photo.quantity + ' 份' : '1 份')
        + (photo.stillExists === false ? '・⚠️ 已下架,抓不到檔案' : '');
      figure.appendChild(caption);

      grid.appendChild(figure);
    }
    show.textContent = '重新簽網址';
    show.disabled = false;
  });

  return box;
}

/**
 * 把一張單往前推一格。
 *
 * **只能往前**(伺服器也擋)。按下去先鎖住按鈕:重複點會送出第二次,而第二次會拿到
 * bad-transition——那不是錯誤,但畫面上長得像錯誤。
 */
async function advance(orderId, to, button) {
  button.disabled = true;
  const { data, error } = await supabase.rpc('admin_advance_print_order', {
    p_order_id: orderId,
    p_to: to,
  });
  if (error) { button.disabled = false; say('ordersOut', describeError(error), 'bad'); return; }

  const outcome = Array.isArray(data) ? data[0] : data;
  if (!outcome || !outcome.ok) {
    button.disabled = false;
    say('ordersOut', outcome && outcome.reason === 'bad-transition'
      ? '這張單的狀態已經不是這一格了(別的分頁或別台裝置推過了),重新整理看看。'
      : '推不動這張單。', 'bad');
    return;
  }
  // 推成功就整份重載:那張卡已經不屬於現在這一格了,留在畫面上只會讓人再點一次。它會出現
  // 在下一格——這正是分頁存在的理由,不然推完就等於消失(#99)。
  await loadOrders();
}

$('reloadOrders').addEventListener('click', () => void loadOrders());

// 發兌換碼 ---------------------------------------------------------------------

$('issueBtn').addEventListener('click', async () => {
  const grants = Number($('grants').value);
  if (!Number.isInteger(grants) || grants <= 0) { say('issueOut', '張數要是大於 0 的整數。', 'bad'); return; }

  $('issueBtn').disabled = true;
  say('issueOut', '發碼中…');
  const { data, error } = await supabase.rpc('admin_issue_code', {
    p_grants_total_photos: grants,
    p_note: $('note').value,
  });
  $('issueBtn').disabled = false;
  if (error) { say('issueOut', describeError(error), 'bad'); return; }

  const issued = Array.isArray(data) ? data[0] : data;
  const node = $('issueOut');
  node.className = 'out';
  node.innerHTML = '';
  const code = document.createElement('div');
  code.className = 'code-out';
  code.textContent = issued.code;
  const hint = document.createElement('div');
  hint.className = 'muted';
  hint.textContent = '把這串給對方,他在房間頁輸入之後那卷會變成 ' + issued.grants_total_photos + ' 張。';
  node.append(code, hint);
});

// 改房間張數 -------------------------------------------------------------------

/** 房間狀態翻成一句人話。畫面上不該出現 shooting 這種字。 */
const STATE_TEXT = {
  joining: '加入期(改得動)',
  shooting: '已經開始拍了(改不動)',
  revealed: '已經開箱了(改不動)',
  abandoned: '已作廢(改不動)',
};

$('findBtn').addEventListener('click', async () => {
  $('setBox').hidden = true;
  say('setOut', '');
  say('findOut', '查詢中…');

  const { data, error } = await supabase.rpc('admin_room_by_code', { p_code: $('roomCode').value });
  if (error) { say('findOut', describeError(error), 'bad'); return; }

  const found = Array.isArray(data) ? data[0] : data;
  if (!found) { say('findOut', '查無這個房間碼。', 'bad'); return; }

  say(
    'findOut',
    found.name + '\n' +
    '現在 ' + found.total_photos + ' 張、' + found.participant_count + ' 個人\n' +
    STATE_TEXT[found.state],
  );
  if (found.state === 'joining') {
    $('total').value = found.total_photos;
    $('setBox').hidden = false;
    $('setBtn').dataset.roomId = found.id;
  }
});

$('setBtn').addEventListener('click', async () => {
  const total = Number($('total').value);
  if (!Number.isInteger(total) || total <= 0) { say('setOut', '張數要是大於 0 的整數。', 'bad'); return; }

  $('setBtn').disabled = true;
  say('setOut', '改中…');
  const { data, error } = await supabase.rpc('admin_set_room_photos', {
    p_room_id: $('setBtn').dataset.roomId,
    p_total: total,
  });
  $('setBtn').disabled = false;
  if (error) { say('setOut', describeError(error), 'bad'); return; }

  const outcome = Array.isArray(data) ? data[0] : data;
  if (outcome.ok) {
    say('setOut', '改好了,現在是 ' + outcome.total_photos + ' 張。', 'ok');
    return;
  }
  say('setOut', {
    'room-locked': '這間房已經開始拍了,張數改不動——配額在開拍那一刻就鎖定並公告了。',
    'room-not-found': '查無這間房。',
    'invalid-total': '張數要是大於 0 的整數。',
  }[outcome.reason] ?? ('改不了:' + outcome.reason), 'bad');
});

// 複製那一句 bootstrap SQL ------------------------------------------------------

$('copySeed').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('seed').textContent);
    $('copySeed').textContent = '複製好了';
  } catch {
    // 沒有剪貼簿權限(非 https、或瀏覽器擋下來)。那一句就在上面,自己選起來複製。
    $('copySeed').textContent = '複製不了,請手動選取上面那一段';
  }
});

await refresh();
</script>
