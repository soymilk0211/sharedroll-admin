<title>SharedRoll 管理後台</title>
<!--
  管理後台那一頁(#74)。

  產品負責人 2026-08-25 在票上拍板走**獨立網頁後台**(路 B):他自己登入的小網頁,不動 App、
  需求規格書 3 的「App 內嚴禁任何管理介面」紅線不必改——那條擋的是消費者拿得到的 App 裡長出
  管理介面,這一頁住在 App 外面,而且只有名單上的帳號叫得動。Studio 那條路也留著,沒有取代。

  ## 為什麼是一份靜態檔,不是 Edge Function

  第一版做成 Edge Function(與 ecpay-checkout 同一招:回一整頁 HTML)。部署起來了、網址也通,
  但**瀏覽器拿到的是原始碼而不是網頁**:沒有自訂網域的專案,GET 回 text/html 會被平台改寫成
  text/plain 並套上 `default-src 'none'; sandbox` 的 CSP
  (supabase.com/docs/guides/functions/limits)。自訂網域是付費加購,官方也明說它不是拿來託管
  前端的。所以這一頁改放 GitHub Pages——那是這個專案已經在用、而且不用錢的地方。

  ## 這一份是原始碼,線上那一份是它的複本

  **這裡是真正的那一份**,連同伺服器那一側的遷移與測試。線上跑的是
  `soymilk0211/sharedroll-admin`(公開 repo,GitHub Pages),網址:

      https://soymilk0211.github.io/sharedroll-admin/

  那個 repo 只是託管的地方。**改請改這裡,再把 index.html 複製過去**——反過來改的話兩邊會漂開,
  而下一個人不會知道哪一份才算數。

  ## 這一份是公開的,而它不該讓任何人多做得了一件事

  底下那三個常數(專案網址、publishable key、Google client id)本來就都是公開的,App 的
  app.json 裡也是明文,而且會跟著安裝檔散到每一支手機上。它們**識別**專案,不**授權**任何事。

  真正的門在資料庫:每一支 admin RPC 第一件事都是問 `is_admin()`,而 `admins` 那張表 RLS 開著
  卻一條政策都不給,對 client 角色等於不存在。把這一頁的網址貼給別人,他看到的是一個登入畫面;
  登進去之後看到的是「這個帳號還不是管理員」。這一頁把按鈕藏起來只是禮貌,不是防線。
-->
<style>
  :root {
    --bg: #0E0C0A; --panel: #1A1410; --divider: #2A2622;
    --text: #EDE4D3; --muted: #B5A88F; --accent: #C9C4BC;
    --ok: #7FB069; --bad: #D98A6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  section {
    background: var(--panel); border: 1px solid var(--divider);
    border-radius: 14px; padding: 16px;
  }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--divider); border-radius: 10px;
    font-size: 16px; font-family: inherit;
  }
  /* 房間碼與兌換碼是照著螢幕唸出來打的,等寬字才分得出 0 和 O。 */
  input.code, .code-out { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.08em; }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--accent);
    background: transparent; color: var(--text); font-size: 16px; font-family: inherit;
    cursor: pointer; min-height: 48px;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.4; cursor: default; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .out { margin-top: 12px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .code-out { font-size: 26px; color: var(--text); letter-spacing: 0.12em; }
  pre {
    background: var(--bg); border: 1px solid var(--divider); border-radius: 10px;
    padding: 12px; overflow-x: auto; font-size: 13px; margin: 12px 0 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* 一張訂單卡。 */
  .order {
    border: 1px solid var(--divider); border-radius: 10px;
    padding: 12px; margin-top: 12px;
  }
  .order h3 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .order .who { font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .order .acts { display: flex; gap: 8px; margin-top: 10px; }
  .order .acts button { margin: 0; }
  .order .copy { border-color: var(--divider); }
  /* 「已退款」。同一排裡唯一不可逆、而且牽涉到錢的那一顆,顏色要跟旁邊分得開(#326)。 */
  .order .danger { border-color: var(--bad); color: var(--bad); }
  /* 訂單狀態的分頁。目前這一格用實邊框,其餘用分隔線的顏色——同一排五顆,靠深淺分主次。 */
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { margin: 0; padding: 9px 4px; font-size: 14px; min-height: 42px; border-color: var(--divider); }
  .tabs button[aria-current="true"] { border-color: var(--accent); background: var(--bg); }
  /* 這張單要洗的那幾張。縮圖點下去是高畫質檔(給點點印用的就是那一層)。 */
  .order .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .order .photos figure { margin: 0; width: 72px; }
  .order .photos img {
    width: 72px; height: 72px; object-fit: cover; display: block;
    border-radius: 6px; background: var(--bg); border: 1px solid var(--divider);
  }
  .order .photos figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 3px; }
  [hidden] { display: none !important; }
</style>

<body>
<main>
  <h1>SharedRoll 管理後台</h1>

  <section id="gate">
    <h2>先登入</h2>
    <p class="muted">用你在 App 裡登入的那個 Google 帳號。</p>
    <div id="gbtn"></div>
    <div id="gateOut" class="out"></div>
  </section>

  <section id="bootstrap" hidden>
    <h2>這個帳號還不是管理員</h2>
    <p class="muted">把下面這一句貼進 Supabase 的 SQL Editor 按 Run,然後回來重新整理這一頁。</p>
    <pre id="seed"></pre>
    <button id="copySeed" type="button">複製那一句</button>
  </section>

  <section id="orders" hidden>
    <h2>訂單</h2>
    <div class="tabs" id="orderTabs"></div>
    <p class="muted" id="ordersHint"></p>
    <button id="reloadOrders" type="button">重新整理</button>
    <div id="ordersOut" class="out"></div>
    <div id="ordersList"></div>
  </section>

  <section id="issue" hidden>
    <h2>發兌換碼</h2>
    <label for="grants">這張碼把房間升到幾張</label>
    <input id="grants" type="number" inputmode="numeric" min="1" step="1" value="72">
    <label for="note">備註(給自己看的,例如「資工系迎新」)</label>
    <input id="note" type="text" autocapitalize="off">
    <button id="issueBtn" type="button">發一張</button>
    <div id="issueOut" class="out"></div>
  </section>

  <section id="room" hidden>
    <h2>改房間張數</h2>
    <p class="muted">只有<strong>還沒開始拍</strong>的房間改得動。開拍那一刻配額就鎖定並公告了,後台也不能事後改寫。</p>
    <label for="roomCode">房間碼(6 碼)</label>
    <input id="roomCode" class="code" type="text" autocapitalize="characters" autocomplete="off" maxlength="8">
    <button id="findBtn" type="button">查這間房</button>
    <div id="findOut" class="out"></div>
    <div id="setBox" hidden>
      <label for="total" style="margin-top:16px">改成幾張</label>
      <input id="total" type="number" inputmode="numeric" min="1" step="1">
      <button id="setBtn" type="button">改成這個張數</button>
      <div id="setOut" class="out"></div>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/**
 * 都是公開值,與 App 的 app.json 一字不差(見檔頭)。抄過來而不是去讀 app.json:這一頁住在
 * 另一個 repo 的 GitHub Pages 上,拿不到那個檔。三個值變動的時候這裡要跟著改——`test/db` 那疊
 * 守不到這件事,因為它們不是程式邏輯,是設定。
 */
const SUPABASE_URL = 'https://mkqdchybsjccxlnhkqsh.supabase.co';
const PUBLISHABLE_KEY = 'sb_publishable_Pe8FGYslT_c9Z3a8QRC_RA_AtjHfKqq';
const GOOGLE_CLIENT_ID = '89775772955-gjemhl8cj6k3f2j9k0965smqt97klp4j.apps.googleusercontent.com';

const supabase = createClient(SUPABASE_URL, PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);

/** 把一句話寫進某個輸出區。tone 是 'ok'、'bad' 或空白。 */
function write(node, text, tone = '') {
  node.textContent = text;
  node.className = 'out ' + tone;
}

/** 同上,但用 id 找。訂單卡片裡的輸出區是動態長出來的、沒有 id,那邊直接用 write。 */
function say(id, text, tone = '') {
  write($(id), text, tone);
}

/**
 * 「請求根本沒送出去」在各層客戶端與各家瀏覽器的說法(#325)。
 *
 * 這幾句話都**不是**在講伺服器回了什麼——是 fetch 自己沒完成。登入過期會長成這副樣子:
 * 沒有授權標頭的請求被 Supabase 的閘道擋在函式之前,而閘道那個錯誤回應沒有 CORS 標頭,
 * 於是瀏覽器只能把它算成連線失敗。真的斷網也長一模一樣,所以話要把兩種都說出來。
 */
const TRANSPORT_FAILURE = /Failed to fetch|Failed to send a request|NetworkError|Load failed/i;
const TRANSPORT_TEXT =
  '請求送不出去。可能是網路不通,也可能是登入過期了——重新整理這一頁、重新登入一次再試。';

/** 登入不在了的時候,每一顆按鈕都說同一句話。 */
const SESSION_GONE = '登入過期了。登入畫面已經放回這一頁最上面,用 Google 登入一次再回來按。';

/**
 * 把 RPC 的錯誤翻成一句人話。
 *
 * 資料庫那一側對非管理員是直接拋 not-admin(而不是回一個溫和的 reason),所以這裡要認得它
 * ——PostgREST 會把它包成一段帶著 SQLSTATE 的英文。
 */
function describeError(error) {
  const raw = (error && (error.message || String(error))) || '';
  if (raw.includes('not-admin')) return '這個帳號不在管理員名單上。';
  if (raw.includes('invalid-total')) return '張數要是大於 0 的整數。';
  if (TRANSPORT_FAILURE.test(raw)) return TRANSPORT_TEXT;
  return '出了點問題:' + raw;
}

/**
 * 把登入畫面放回來。
 *
 * 登入成功之後 `refresh()` 就把整段 `gate` 藏起來了,所以在「請重新登入」的那一刻,畫面上
 * 其實一顆登得了的按鈕都沒有——只講一句話等於叫人去按一個看不到的東西。順便捲上去,不然
 * 他人在訂單卡片那邊,那顆按鈕在螢幕外。
 */
function reopenGate() {
  $('gate').hidden = false;
  $('gate').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/**
 * 送出任何「以我的身分」的請求之前,先確認登入還在(#325)。
 *
 * 不擋的話,登入過期表現出來的是一句指不到原因的話:2026-09-03 按「看要洗哪幾張」得到的是
 * `Failed to send a request to the Edge Function`,而那一頁上的訂單列表照常顯示(那是登入
 * 還在的時候載進來的),所以完全看不出是登入的問題,只看得出「好像壞了」。
 *
 * 回 false 的時候,這個函式已經把話寫進 out、也把登入畫面放回來了,呼叫端直接收工就好。
 */
async function requireSession(out) {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) return true;
  reopenGate();
  write(out, SESSION_GONE, 'bad');
  return false;
}

/** 登入之後問「我是誰」,據此決定這一頁長什麼樣。 */
async function refresh() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;

  const { data, error } = await supabase.rpc('admin_whoami');
  if (error) { say('gateOut', describeError(error), 'bad'); return; }
  const me = Array.isArray(data) ? data[0] : data;

  $('gate').hidden = true;
  if (me && me.is_admin) {
    $('orders').hidden = false;
    $('issue').hidden = false;
    $('room').hidden = false;
    renderTabs();
    void loadOrders();
    return;
  }
  // 名單是空的時候,這一頁要說得出「該把哪一串貼進 Studio」——不然沒有人知道怎麼開始。
  $('bootstrap').hidden = false;
  $('seed').textContent =
    "insert into public.admins (user_id, note)\nvalues ('" + (me && me.user_id) + "', '產品負責人');";
}

// 登入 -------------------------------------------------------------------------

window.handleGoogleCredential = async (response) => {
  const { error } = await supabase.auth.signInWithIdToken({
    provider: 'google',
    token: response.credential,
  });
  if (error) { say('gateOut', describeError(error), 'bad'); return; }
  await refresh();
};

const gsi = document.createElement('script');
gsi.src = 'https://accounts.google.com/gsi/client';
gsi.async = true;
gsi.onload = () => {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: (response) => window.handleGoogleCredential(response),
  });
  // 用按鈕不用 One Tap:One Tap 在 Safari 與擋第三方 cookie 的瀏覽器上常常整個不出現,
  // 而那時畫面上會什麼都沒有,看起來就像這一頁壞了。
  google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'large', width: 320 });
};
gsi.onerror = () => say('gateOut', '連不到 Google 的登入元件,檢查一下網路。', 'bad');
document.head.appendChild(gsi);

// 待處理的訂單 -----------------------------------------------------------------

/**
 * 訂單的五格,對上資料庫狀態機的五個落點(#99、#326)。
 *
 * 原本這一頁**寫死只查 paid**,而卡片上只有一顆「已在點點印下單」。按下去那張單變成
 * submitted,卡片就從畫面上永久消失——後台沒有第二個查詢、也沒有「已出貨」的按鈕,所以那張
 * 單再也推不動。`admin_advance_print_order` 只能往前,救不回來;使用者那一側於是永遠顯示
 * 「沖印中」,實體照片明明已經寄到了。這不是偶發,是**每一張單都會發生**。
 *
 * 「已退款」那一格存在的理由一模一樣:按下「已退款」之後那張單要還找得到,不然它就從後台
 * 消失了,而消失的那張單正是最需要查得到的那一種。
 *
 * `empty` 是這一格沒有單時要說的話。五格的空狀態意思完全不同:「待處理」空著是好事,
 * 「出不了」空著也是好事,而「已下單」空著只是還沒輪到。
 */
const ORDER_TABS = [
  {
    state: 'paid',
    label: '待處理',
    hint: '收了錢、還沒去點點印下單的。先付款的排前面。',
    empty: '目前沒有待處理的訂單。',
  },
  {
    state: 'submitted',
    label: '已下單',
    hint: '點點印那邊在做。包裹寄出去之後回來按「已出貨」——不按的話,使用者的 App 會一直寫著「沖印中」。',
    empty: '沒有正在做的訂單。',
  },
  {
    state: 'shipped',
    label: '已出貨',
    hint: '做完寄出去的。留著查,沒有動作要做。',
    empty: '還沒有出貨過的訂單。',
  },
  {
    state: 'failed',
    label: '出不了',
    hint: '收了錢但做不出來的。這幾張**一定要退款**:先去綠界後台按退刷,回來按卡片上的「已退款」。',
    empty: '沒有做不出來的訂單。',
  },
  {
    state: 'refunded',
    label: '已退款',
    hint: '錢已經退回去的。留著查,沒有動作要做——使用者的 App 上這幾張寫的是「已退款」。',
    empty: '還沒有退過款的訂單。',
  },
];

let currentState = 'paid';

function renderTabs() {
  const tabs = $('orderTabs');
  tabs.innerHTML = '';
  for (const tab of ORDER_TABS) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = tab.label;
    // aria-current 同時是樣式的鉤子與給輔助技術的訊息,不另外加一個 class。
    if (tab.state === currentState) button.setAttribute('aria-current', 'true');
    button.addEventListener('click', () => {
      currentState = tab.state;
      renderTabs();
      void loadOrders();
    });
    tabs.appendChild(button);
  }
  $('ordersHint').textContent = ORDER_TABS.find((t) => t.state === currentState).hint;
}

/**
 * 目前這一格的訂單。
 *
 * Phase 1 的履行是人工的:這一區就是那份工作清單。每張卡要一眼看得到**貼得進點點印表單的
 * 東西**——收件人、電話、郵遞區號+地址、洗幾張——所以有一顆「複製收件資料」把它整段抓走,
 * 不必在小螢幕上逐欄選取;要洗哪幾張則按「看要洗哪幾張」展開(#100)。
 */
// 一次抓幾張。多要一筆是為了知道「後面還有沒有」——第 51 張之後永遠看不到、而畫面一直寫
// 「50 張待處理」,是 #110 裡最痛的那一個:使用者付了錢、訂單卡在 paid、沒有人知道。
const ORDERS_PAGE_SIZE = 200;
let ordersShown = 0;

async function loadOrders(append) {
  // 擋在清空列表之前:登入過期的時候,畫面上那份(登入還在時載進來的)清單留著比清掉有用。
  if (!(await requireSession($('ordersOut')))) return;

  const tab = ORDER_TABS.find((t) => t.state === currentState);
  say('ordersOut', '載入中…');
  if (!append) {
    ordersShown = 0;
    $('ordersList').innerHTML = '';
  } else {
    const older = $('ordersMore');
    if (older) older.remove();
  }

  const { data, error } = await supabase.rpc('admin_print_orders', {
    p_state: currentState,
    p_limit: ORDERS_PAGE_SIZE + 1,
    p_offset: ordersShown,
  });
  if (error) { say('ordersOut', describeError(error), 'bad'); return; }

  const rows = Array.isArray(data) ? data : [];
  if (rows.length === 0 && ordersShown === 0) {
    say('ordersOut', tab.empty);
    return;
  }
  const hasMore = rows.length > ORDERS_PAGE_SIZE;
  const orders = hasMore ? rows.slice(0, ORDERS_PAGE_SIZE) : rows;
  for (const order of orders) {
    $('ordersList').appendChild(orderCard(order));
  }
  ordersShown += orders.length;
  say('ordersOut', hasMore ? ordersShown + ' 張(後面還有)' : ordersShown + ' 張');

  if (hasMore) {
    const more = document.createElement('button');
    more.type = 'button';
    more.id = 'ordersMore';
    more.textContent = '載入更多';
    more.addEventListener('click', () => void loadOrders(true));
    $('ordersList').appendChild(more);
  }
}

/** 收件資料整段的樣子。複製出去直接貼進點點印。 */
function recipientBlock(order) {
  // 換行一定要寫成 '\n'。在字串中間直接斷行是語法錯誤,而語法錯誤會讓整個
  // 整段程式一行都不執行——不是只有這個函式壞掉,是整頁死當(#118)。
  return order.recipient_name + '\n'
    + order.recipient_phone + '\n'
    + order.recipient_zip + ' ' + order.recipient_address;
}

function orderCard(order) {
  const card = document.createElement('div');
  card.className = 'order';

  const title = document.createElement('h3');
  const count = order.prints === null ? '相片書' : order.prints + ' 張';
  title.textContent = count + '・NT$' + order.amount + '・' + (order.room_name || '');
  card.appendChild(title);

  // 這張單要不要印拍攝日期(產品負責人 2026-09-03)。**要印的才顯示**:不印是預設,寫出來
  // 只是噪音;而要印的那幾張是這一頁上唯一需要多做一件事的,所以它得跳出來。
  //
  // ⚠️ 下載到的原圖**不含日期**——雲端存檔一律是乾淨的(需求規格書 1.4),日期是匯出當下
  // 在裝置上合成的。把它壓到要送印的檔案上的工具還沒做(#330),在那之前這一行是提醒,
  // 不是「已經處理好了」。
  if (order.with_date_stamp) {
    const stamp = document.createElement('p');
    stamp.className = 'out';
    stamp.textContent = '這張單要在照片右下角印上拍攝日期 —— 展開下面那一區,用每一張的'
      + '「下載(含日期)」存檔,不要直接點縮圖(R2 上存的是沒有日期的原圖)。';
    card.appendChild(stamp);
  }

  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = recipientBlock(order);
  card.appendChild(who);

  const acts = document.createElement('div');
  acts.className = 'acts';

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'copy';
  copy.textContent = '複製收件資料';
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(recipientBlock(order));
      copy.textContent = '複製好了';
    } catch {
      // 沒有剪貼簿權限。整段就在上面,自己選起來複製。
      copy.textContent = '複製不了,請手動選取';
    }
  });
  acts.appendChild(copy);

  // 往前推一格的按鈕:每一格各自不同,最後兩格沒有動作(#99)。
  const NEXT = { paid: ['submitted', '已在點點印下單'], submitted: ['shipped', '已出貨'] };
  const next = NEXT[order.state];
  if (next) {
    const done = document.createElement('button');
    done.type = 'button';
    done.textContent = next[1];
    done.addEventListener('click', () => void advance(order.id, next[0], done));
    acts.appendChild(done);
  }

  card.appendChild(acts);

  // 「已退款」自己一排(#326),不跟上面那兩顆並排。
  //
  // 兩個理由。一是**它跟旁邊那顆不是同一種動作**:往前推按錯了,代價是「那就去做那件事」;
  // 這一顆按錯,代價是使用者的 App 上寫著「已退款」而錢根本沒動,而且推不回來(狀態機只能
  // 往前,要進 Studio 以 postgres 身分改)。二是三顆擠在 375 寬的手機上,「已在點點印下單」
  // 會被壓成三行。
  //
  // 只有待處理與出不了兩格有:submitted 那一刻照片已經拿去印了,那時候退款是純虧
  // (產品負責人 2026-09-03 拍板)。這裡不畫是禮貌,資料庫那一側也擋著。
  if (order.state === 'paid' || order.state === 'failed') {
    card.appendChild(refundButton(order));
  }

  // 要洗哪幾張(#100)。預設收起來:一張單十幾二十張縮圖,四張單就把清單淹了,而多數時候
  // 要看的是收件資料。展開才去簽網址——presigned URL 是有效期的,不該在載入清單時就先簽一批。
  if (order.state === 'paid' || order.state === 'submitted' || order.state === 'shipped') {
    card.appendChild(photosBlock(order));
  }

  // 出不了的單要提醒退款。第一版是人工退刷(#326):錢由人去綠界後台按,這一頁上那顆
  // 「已退款」只負責記帳——所以順序講清楚,不然按了這裡卻沒去綠界,使用者看到「已退款」
  // 而錢沒回去。
  if (order.state === 'failed') {
    const warn = document.createElement('div');
    warn.className = 'out bad';
    warn.textContent = '這張收了錢但做不出來,一定要退款。'
      + '先去綠界後台按退刷,錢真的退出去之後,再回來按上面的「已退款」記帳。';
    card.appendChild(warn);
  }

  // 已退款的單:講清楚使用者那一側現在看到什麼,免得又被問一次。
  if (order.state === 'refunded') {
    const note = document.createElement('div');
    note.className = 'out';
    note.textContent = '這張已經記成退款了。使用者的 App 上寫的是「已退款,錢會在幾個工作天內'
      + '回到你原本的付款方式」。實際退了沒以綠界後台為準。';
    card.appendChild(note);
  }

  return card;
}

/**
 * 「已退款」那一顆(#326)。
 *
 * **這一頁上唯一要按兩次的按鈕。** 其他每一顆按錯的代價都是「那就去做那件事」;這一顆按錯,
 * 使用者的 App 上就寫著「已退款」而錢根本沒動,而且推不回來。第一下只是舉手,五秒沒有第二下
 * 就自己放下——不用 confirm():那個對話框在有些瀏覽器裡被擋掉,擋掉的時候它會直接回 false,
 * 於是這顆按鈕變成永遠按不動,而畫面上看不出為什麼。
 *
 * 錢**不是**這顆按的:第一版是人工退刷,人去綠界後台按退刷,這裡只負責記帳。所以字寫的是
 * 「已退款」(過去式)而不是「退款」。
 */
function refundButton(order) {
  const row = document.createElement('div');
  row.className = 'acts';

  const label = '已退款';
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'danger';
  button.textContent = label;

  let armed = false;
  let disarm = null;
  button.addEventListener('click', () => {
    if (!armed) {
      armed = true;
      button.textContent = '確定退過了?再按一次';
      disarm = setTimeout(() => { armed = false; button.textContent = label; }, 5000);
      return;
    }
    // 先解除再送出:推不動的時候(例如另一個分頁已經把它推到 submitted)這一顆會留在畫面上,
    // 而它不該還舉著「再按一次」——那時候按下去等於沒有第二道關。
    clearTimeout(disarm);
    armed = false;
    button.textContent = label;
    void advance(order.id, 'refunded', button);
  });

  row.appendChild(button);
  return row;
}

/**
 * `admin-print-photos` 回得出來的每一種 reason,對應一句人話(#325)。
 *
 * 這張表三個地方共用:函式用 200 回的「被拒」、用 4xx/5xx 回的錯誤、以及要位元組那一條路。
 * 沒有它的時候,畫面上長出來的是 `not-authenticated` 這種只有寫的人看得懂的字;而 4xx/5xx
 * 那一種更糟——supabase-js 對所有非 2xx 的回應**一律**只說一句 `Edge Function returned a
 * non-2xx status code`,於是「登入過期」「照片被下架」「金鑰沒設齊」在畫面上一模一樣。
 *
 * 這幾個字串要跟著 supabase/functions/admin-print-photos/index.ts 與它叫的那支 SQL 走;
 * 少了哪一個,test/print/admin-print-photos-reasons.test.ts 會紅。
 */
const PHOTO_REASONS = {
  'not-authenticated': SESSION_GONE,
  'not-admin': '這個帳號不在管理員名單上。',
  'order-not-found': '查無這張單,重新整理訂單列表看看。',
  'order-not-fulfilling': '這張單現在的狀態不該拿照片(還沒付款、已經取消、或已經退款了)。',
  'order-has-no-photos': '這張單裡一張照片都沒有。這不該發生,把單號記下來。',
  'photo-not-in-order': '這一張不屬於這張單,重新整理訂單列表再試一次。',
  'photo-file-missing': '這一張的檔案在儲存空間裡找不到,多半是已經被下架了。',
  'bad-request': '送出去的單號格式不對。這是後台自己的問題,把單號記下來。',
  'method-not-allowed': '這一頁用錯了請求方法。這是後台自己的問題。',
  'server-misconfigured': '伺服器上少了儲存空間的金鑰,那支函式跑不起來。',
  'grant-error': '資料庫那一步失敗了。稍後再試;一直這樣就要去看那支函式的紀錄。',
};

/**
 * reason 翻成人話。認不得的原字串照樣顯示——那比一句和善的廢話有用。
 */
function photoReasonText(reason) {
  return PHOTO_REASONS[reason] ?? ('拿不到照片:' + (reason || 'unknown'));
}

/**
 * 把函式回的 reason 從錯誤裡挖出來。挖不到(例如請求根本沒送出去)回 null。
 *
 * supabase-js 對非 2xx 只丟一句制式的英文,函式自己寫在 body 裡的 reason 收在 `error.context`
 * ——那是原封不動的 Response。clone 過再讀,免得動到別人可能還要用的 body。
 */
async function reasonInResponse(error) {
  const response = error && error.context;
  if (!response || typeof response.clone !== 'function') return null;
  try {
    const body = await response.clone().json();
    return (body && typeof body.reason === 'string') ? body.reason : null;
  } catch {
    return null;
  }
}

/**
 * 呼叫 `admin-print-photos` 失敗時,該顯示的那一句話。
 *
 * 順手做一件事:原因是登入過期的話,把登入畫面放回來——這一種是唯一「他馬上做得了什麼」的
 * 失敗,而做得了的那件事需要一顆看得見的按鈕。
 */
async function photoFailureText(error) {
  const reason = await reasonInResponse(error);
  if (reason) {
    if (reason === 'not-authenticated') reopenGate();
    return photoReasonText(reason);
  }
  const raw = (error && (error.message || String(error))) || '';
  if (TRANSPORT_FAILURE.test(raw)) return TRANSPORT_TEXT;
  return '拿不到照片:' + raw;
}

/**
 * 「看要洗哪幾張」那一塊(#100)。
 *
 * 在這之前後台只印得出「12 張・NT$300」,而人工履行需要的正是**檔案本身**——管理員只能自己
 * 進 Supabase Studio 下 SQL 把 photo_ids 撈出來、再一顆一顆去 R2 找。R2 桶是私有的,所以網址
 * 要由伺服器簽:admin-print-photos 那支 Edge Function 驗完身分,問 SQL「這個管理員能不能拿
 * 這張履行中的訂單的檔案」,才簽 presigned URL 回來。
 *
 * 縮圖點下去開的是**高畫質那一層**——貼進點點印的是那一份,縮圖只是拿來認人的。
 */
function photosBlock(order) {
  const box = document.createElement('div');

  const acts = document.createElement('div');
  acts.className = 'acts';
  const show = document.createElement('button');
  show.type = 'button';
  show.className = 'copy';
  show.textContent = '看要洗哪幾張';
  acts.appendChild(show);
  box.appendChild(acts);

  const out = document.createElement('div');
  out.className = 'out';
  box.appendChild(out);

  const grid = document.createElement('div');
  grid.className = 'photos';
  box.appendChild(grid);

  show.addEventListener('click', async () => {
    show.disabled = true;
    write(out, '簽網址中…');
    grid.innerHTML = '';

    if (!(await requireSession(out))) { show.disabled = false; return; }

    const { data, error } = await supabase.functions.invoke('admin-print-photos', {
      body: { orderId: order.id },
    });
    if (error) {
      show.disabled = false;
      write(out, await photoFailureText(error), 'bad');
      return;
    }
    if (!data || !data.ok) {
      show.disabled = false;
      write(out, photoReasonText(data && data.reason), 'bad');
      return;
    }

    const hours = Math.round(data.expiresInSeconds / 3600);
    out.textContent = data.photos.length + ' 張,網址 ' + hours + ' 小時內有效。'
      + '點縮圖開的是高畫質那一層,貼進點點印的就是它。';
    for (const photo of data.photos) {
      const figure = document.createElement('figure');

      const link = document.createElement('a');
      link.href = photo.full.url;
      link.target = '_blank';
      link.rel = 'noopener';

      const img = document.createElement('img');
      img.src = photo.thumbnail.url;
      img.loading = 'lazy';
      img.alt = '第 ' + photo.ordinal + ' 張';
      link.appendChild(img);
      figure.appendChild(link);

      const caption = document.createElement('figcaption');
      // 下架的照片仍然列在清單裡(張數不可以悄悄變少),但要標出來是哪一張(#117)。
      // 沒有這一行的話,它只會表現成「有一個網址點下去抓不到東西」。
      caption.textContent = (photo.quantity > 1 ? photo.quantity + ' 份' : '1 份')
        + (photo.stillExists === false ? '・⚠️ 已下架,抓不到檔案' : '');
      figure.appendChild(caption);

      // 要印日期的那幾張,多一顆「下載(含日期)」(#330)。
      //
      // 上面那條「點縮圖開的是高畫質那一層」對這幾張**不適用**:R2 上存的是乾淨的原圖,
      // 日期是合成上去的。貼進點點印的要是這顆按鈕存下來的那一份。
      if (photo.dateStamp && photo.stillExists !== false) {
        const stampButton = document.createElement('button');
        stampButton.type = 'button';
        stampButton.textContent = '下載(含日期)';
        stampButton.addEventListener('click', () => {
          void downloadWithDateStamp(stampButton, out, order.id, photo);
        });
        figure.appendChild(stampButton);
      }

      grid.appendChild(figure);
    }
    show.textContent = '重新簽網址';
    show.disabled = false;
  });

  return box;
}

/**
 * 把日期畫上去,存成一個檔案(#330)。
 *
 * ## 為什麼是這一頁在畫,而不是伺服器
 *
 * R2 上存的照片**一律不含日期**(需求規格書 1.4)——日期是「存進相簿」的當下在手機上合成的。
 * 送印這條路上沒有手機在現場,所以要有人補上。放在瀏覽器裡畫的理由是:這一頁本來就要把
 * 那張圖載下來給人看,而 canvas 沒有伺服器那邊的記憶體與時間限制。
 *
 * ## 為什麼位元組要繞一手
 *
 * 圖不是從 R2 的 presigned URL 直接抓的,是跟 `admin-print-photos` 要的。canvas 一旦畫進一張
 * 跨網域、沒有 CORS 標頭的圖就會被「污染」,`toBlob` 會直接拋例外,而 R2 的 presigned URL
 * 預設不帶那個標頭。我們自己那一支的 CORS 是我們設的。
 *
 * ## 那組數字的形狀不在這裡
 *
 * 多邊形是伺服器算好交過來的(`_shared/date-stamp.ts`),這裡只負責照著填。座標是**以照片
 * 寬度為 1 的比例**,所以乘上 `canvas.width` 就得到與 App 匯出時一模一樣的位置與大小。
 * 這一頁不自己算幾何 —— 這個 repo 已經被「同一件事各寫一份」咬過兩次(#114、#118)。
 */
async function downloadWithDateStamp(button, out, orderId, photo) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '合成中…';
  try {
    if (!(await requireSession(out))) return;

    const { data, error } = await supabase.functions.invoke('admin-print-photos', {
      body: { orderId: orderId, photoId: photo.photoId },
    });
    if (error) throw new Error(await photoFailureText(error));
    // 回的是 JSON 就是被拒了(位元組那條路成功時回的是 image/*)。
    if (!(data instanceof Blob)) throw new Error(photoReasonText(data && data.reason));
    if (data.type.indexOf('image/') !== 0) {
      throw new Error('拿回來的不是圖檔(' + (data.type || '沒有型別') + ')。');
    }

    const bitmap = await createImageBitmap(data);
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0);
    bitmap.close();

    // 整組數字推到右下角。座標是比例,一律乘 canvas.width —— 連垂直方向也是,因為 App 那一份
    // 的每一個尺寸都是由**寬度**推導的(見 export/date-stamp.ts 的檔頭)。
    const scale = canvas.width;
    const stamp = photo.dateStamp;
    const originX = canvas.width - stamp.right * scale - stamp.width * scale;
    const originY = canvas.height - stamp.bottom * scale - stamp.height * scale;
    ctx.fillStyle = stamp.color;
    for (const segment of stamp.segments) {
      ctx.beginPath();
      for (const [index, point] of segment.entries()) {
        const x = originX + point[0] * scale;
        const y = originY + point[1] * scale;
        if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.95));
    if (!blob) throw new Error('存不出檔案');
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = 'sharedroll-' + photo.ordinal + '-' + photo.photoId.slice(0, 8) + '.jpg';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    // 立刻撤掉:這一份是整張高畫質照片,留在記憶體裡沒有意義。
    URL.revokeObjectURL(url);
    button.textContent = '已下載';
  } catch (caught) {
    // 直說,而且寫在下面那塊輸出區裡:按鈕上的字兩秒後就被換回去了,一句完整的話讀不完
    // ——而現在這裡的話是完整的一句(#325),不再是一串英文代碼。
    button.textContent = '失敗';
    write(out, (caught && caught.message) ? caught.message : String(caught), 'bad');
  } finally {
    button.disabled = false;
    // 兩秒後把字換回來,不然按過的那顆永遠寫著「已下載」。
    setTimeout(() => { button.textContent = label; }, 2000);
  }
}

/**
 * 把一張單往前推一格。
 *
 * **只能往前**(伺服器也擋)。按下去先鎖住按鈕:重複點會送出第二次,而第二次會拿到
 * bad-transition——那不是錯誤,但畫面上長得像錯誤。
 */
async function advance(orderId, to, button) {
  button.disabled = true;
  if (!(await requireSession($('ordersOut')))) { button.disabled = false; return; }

  const { data, error } = await supabase.rpc('admin_advance_print_order', {
    p_order_id: orderId,
    p_to: to,
  });
  // 話寫在清單最上面那一塊,而按鈕可能在幾張卡片以下——不捲過去的話,他只看到按鈕彈回來、
  // 什麼都沒發生(#105 要的「留得下線索」,線索看不到等於沒有)。
  const complain = (text) => {
    button.disabled = false;
    say('ordersOut', text, 'bad');
    $('ordersOut').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  if (error) { complain(describeError(error)); return; }

  const outcome = Array.isArray(data) ? data[0] : data;
  if (!outcome || !outcome.ok) {
    complain(outcome && outcome.reason === 'bad-transition'
      ? '這張單的狀態已經不是這一格了(別的分頁或別台裝置推過了),重新整理看看。'
      : '推不動這張單。');
    return;
  }
  // 推成功就整份重載:那張卡已經不屬於現在這一格了,留在畫面上只會讓人再點一次。它會出現
  // 在下一格——這正是分頁存在的理由,不然推完就等於消失(#99)。
  await loadOrders();
}

$('reloadOrders').addEventListener('click', () => void loadOrders());

// 發兌換碼 ---------------------------------------------------------------------

$('issueBtn').addEventListener('click', async () => {
  const grants = Number($('grants').value);
  if (!Number.isInteger(grants) || grants <= 0) { say('issueOut', '張數要是大於 0 的整數。', 'bad'); return; }

  $('issueBtn').disabled = true;
  say('issueOut', '發碼中…');
  if (!(await requireSession($('issueOut')))) { $('issueBtn').disabled = false; return; }

  const { data, error } = await supabase.rpc('admin_issue_code', {
    p_grants_total_photos: grants,
    p_note: $('note').value,
  });
  $('issueBtn').disabled = false;
  if (error) { say('issueOut', describeError(error), 'bad'); return; }

  const issued = Array.isArray(data) ? data[0] : data;
  const node = $('issueOut');
  node.className = 'out';
  node.innerHTML = '';
  const code = document.createElement('div');
  code.className = 'code-out';
  code.textContent = issued.code;
  const hint = document.createElement('div');
  hint.className = 'muted';
  hint.textContent = '把這串給對方,他在房間頁輸入之後那卷會變成 ' + issued.grants_total_photos + ' 張。';
  node.append(code, hint);
});

// 改房間張數 -------------------------------------------------------------------

/** 房間狀態翻成一句人話。畫面上不該出現 shooting 這種字。 */
const STATE_TEXT = {
  joining: '加入期(改得動)',
  shooting: '已經開始拍了(改不動)',
  revealed: '已經開箱了(改不動)',
  abandoned: '已作廢(改不動)',
};

$('findBtn').addEventListener('click', async () => {
  $('setBox').hidden = true;
  say('setOut', '');
  say('findOut', '查詢中…');
  if (!(await requireSession($('findOut')))) return;

  const { data, error } = await supabase.rpc('admin_room_by_code', { p_code: $('roomCode').value });
  if (error) { say('findOut', describeError(error), 'bad'); return; }

  const found = Array.isArray(data) ? data[0] : data;
  if (!found) { say('findOut', '查無這個房間碼。', 'bad'); return; }

  say(
    'findOut',
    found.name + '\n' +
    '現在 ' + found.total_photos + ' 張、' + found.participant_count + ' 個人\n' +
    STATE_TEXT[found.state],
  );
  if (found.state === 'joining') {
    $('total').value = found.total_photos;
    $('setBox').hidden = false;
    $('setBtn').dataset.roomId = found.id;
  }
});

$('setBtn').addEventListener('click', async () => {
  const total = Number($('total').value);
  if (!Number.isInteger(total) || total <= 0) { say('setOut', '張數要是大於 0 的整數。', 'bad'); return; }

  $('setBtn').disabled = true;
  say('setOut', '改中…');
  if (!(await requireSession($('setOut')))) { $('setBtn').disabled = false; return; }

  const { data, error } = await supabase.rpc('admin_set_room_photos', {
    p_room_id: $('setBtn').dataset.roomId,
    p_total: total,
  });
  $('setBtn').disabled = false;
  if (error) { say('setOut', describeError(error), 'bad'); return; }

  const outcome = Array.isArray(data) ? data[0] : data;
  if (outcome.ok) {
    say('setOut', '改好了,現在是 ' + outcome.total_photos + ' 張。', 'ok');
    return;
  }
  say('setOut', {
    'room-locked': '這間房已經開始拍了,張數改不動——配額在開拍那一刻就鎖定並公告了。',
    'room-not-found': '查無這間房。',
    'invalid-total': '張數要是大於 0 的整數。',
  }[outcome.reason] ?? ('改不了:' + outcome.reason), 'bad');
});

// 複製那一句 bootstrap SQL ------------------------------------------------------

$('copySeed').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('seed').textContent);
    $('copySeed').textContent = '複製好了';
  } catch {
    // 沒有剪貼簿權限(非 https、或瀏覽器擋下來)。那一句就在上面,自己選起來複製。
    $('copySeed').textContent = '複製不了,請手動選取上面那一段';
  }
});

await refresh();
</script>
</body>
</html>
